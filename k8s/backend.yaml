apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-unifier-backend
  namespace: ai-unifier
  labels:
    app: ai-unifier-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-unifier-backend
  template:
    metadata:
      labels:
        app: ai-unifier-backend
    spec:
      containers:
      - name: backend
        image: ai-unifier-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: ai-unifier-config
        - secretRef:
            name: ai-unifier-secrets
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: connection-string
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: connection-string
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-unifier-backend
  namespace: ai-unifier
  labels:
    app: ai-unifier-backend
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: ai-unifier-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-unifier-backend-hpa
  namespace: ai-unifier
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-unifier-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
