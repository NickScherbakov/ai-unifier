apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-unifier-ingress
  namespace: ai-unifier
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - ai-unifier.example.com
    - api.ai-unifier.example.com
    secretName: ai-unifier-tls
  rules:
  - host: ai-unifier.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-unifier-frontend
            port:
              number: 80
  - host: api.ai-unifier.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-unifier-backend
            port:
              number: 4000
